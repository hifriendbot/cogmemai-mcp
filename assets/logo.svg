<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1923"/>
      <stop offset="100%" style="stop-color:#162231"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2dd4a8"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="48" ry="48" fill="url(#bg)"/>

  <!-- Grid lines (subtle) -->
  <g stroke="#1e3a4f" stroke-width="0.5" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="240" y1="0" x2="240" y2="400"/>
    <line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="0" y1="80" x2="400" y2="80"/>
    <line x1="0" y1="160" x2="400" y2="160"/>
    <line x1="0" y1="240" x2="400" y2="240"/>
    <line x1="0" y1="320" x2="400" y2="320"/>
  </g>

  <!-- Brain/memory icon - stylized -->
  <g transform="translate(200,180)" fill="none" stroke="url(#glow)" stroke-width="4" stroke-linecap="round">
    <!-- Outer brain shape -->
    <path d="M-60,-50 C-60,-80 -30,-95 0,-95 C30,-95 60,-80 60,-50 C75,-40 80,-15 70,10 C80,30 70,55 50,65 C40,80 15,85 0,85 C-15,85 -40,80 -50,65 C-70,55 -80,30 -70,10 C-80,-15 -75,-40 -60,-50Z" stroke-width="5"/>

    <!-- Neural network nodes -->
    <circle cx="-30" cy="-40" r="8" fill="#2dd4a8" stroke="none"/>
    <circle cx="30" cy="-40" r="8" fill="#2dd4a8" stroke="none"/>
    <circle cx="0" cy="-10" r="10" fill="#2dd4a8" stroke="none"/>
    <circle cx="-40" cy="20" r="7" fill="#2dd4a8" stroke="none"/>
    <circle cx="40" cy="20" r="7" fill="#2dd4a8" stroke="none"/>
    <circle cx="-15" cy="50" r="6" fill="#2dd4a8" stroke="none"/>
    <circle cx="15" cy="50" r="6" fill="#2dd4a8" stroke="none"/>

    <!-- Neural connections -->
    <line x1="-30" y1="-40" x2="0" y2="-10" stroke="#2dd4a8" stroke-width="2.5" opacity="0.7"/>
    <line x1="30" y1="-40" x2="0" y2="-10" stroke="#2dd4a8" stroke-width="2.5" opacity="0.7"/>
    <line x1="-30" y1="-40" x2="-40" y2="20" stroke="#2dd4a8" stroke-width="2.5" opacity="0.7"/>
    <line x1="30" y1="-40" x2="40" y2="20" stroke="#2dd4a8" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="-10" x2="-40" y2="20" stroke="#2dd4a8" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="-10" x2="40" y2="20" stroke="#2dd4a8" stroke-width="2.5" opacity="0.7"/>
    <line x1="-40" y1="20" x2="-15" y2="50" stroke="#2dd4a8" stroke-width="2.5" opacity="0.7"/>
    <line x1="40" y1="20" x2="15" y2="50" stroke="#2dd4a8" stroke-width="2.5" opacity="0.7"/>
    <line x1="0" y1="-10" x2="-15" y2="50" stroke="#2dd4a8" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-10" x2="15" y2="50" stroke="#2dd4a8" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- Text -->
  <text x="200" y="330" text-anchor="middle" fill="#2dd4a8" font-family="system-ui,-apple-system,sans-serif" font-size="36" font-weight="700" letter-spacing="1">CogmemAi</text>
  <text x="200" y="360" text-anchor="middle" fill="#5eead4" font-family="system-ui,-apple-system,sans-serif" font-size="14" font-weight="400" opacity="0.7" letter-spacing="2">MEMORY THAT THINKS</text>
</svg>
